<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a5f4a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121916" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Нет интернета — LangSwipe</title>
    <style>
      :root {
        color-scheme: light;
        --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
        --color-bg: #f4f7f5;
        --color-primary: #1a5f4a;
        --color-primary-light: #2d8a6e;
        --color-heading: #1a5f4a;
        --color-text: #1c2421;
        --color-muted: #5c6b64;
        --color-on-primary: #ffffff;
        --color-primary-edge: transparent;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --color-bg: #121916;
          --color-primary-light: #3aa37f;
          --color-heading: #8ecfb3;
          --color-text: #e7eeea;
          --color-muted: #a7b8b1;
          --color-primary-edge: rgba(255, 255, 255, 0.16);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--color-bg);
      }
      body {
        min-height: 100dvh;
        font-family: var(--font-sans);
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
      }
      .offline-shell {
        width: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 22rem;
        margin: 0 auto;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem
          calc(1.5rem + env(safe-area-inset-bottom, 0px));
      }
      .offline-mark {
        width: 5.5rem;
        height: 5.5rem;
      }
      .offline-logo {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      @media (prefers-color-scheme: dark) {
        .offline-card-back rect {
          fill: #3aa37f;
        }
        .offline-card-front rect {
          fill: #2f8f72;
        }
      }
      .offline-wordmark {
        margin: 1.15rem 0 0;
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--color-heading);
      }
      .offline-shell h1 {
        margin: 1.35rem 0 0;
        width: 100%;
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--color-heading);
      }
      .offline-lead {
        margin: 0.55rem 0 0;
        width: 100%;
        font-size: 1rem;
        line-height: 1.45;
        color: var(--color-muted);
      }
      .offline-retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 12.5rem;
        margin-top: 1.5rem;
        padding: 0.875rem 1.25rem;
        border: none;
        border-radius: 12px;
        background: var(--color-primary);
        color: var(--color-on-primary);
        box-shadow: inset 0 0 0 1px var(--color-primary-edge);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      .offline-retry:active {
        transform: scale(0.98);
      }
      .offline-status {
        margin: 0.85rem 0 0;
        width: 100%;
        min-height: 1.4em;
        font-size: 0.875rem;
        line-height: 1.4;
        color: var(--color-muted);
      }
    </style>
  </head>
  <body>
    <main class="offline-shell">
      <div class="offline-mark" aria-hidden="true">
        <svg class="offline-logo" viewBox="0 0 72 72" focusable="false">
          <g class="offline-card-back">
            <rect x="10.5" y="9.5" width="52" height="52" rx="13" fill="#2d8a6e" />
          </g>
          <g class="offline-card-front">
            <rect x="8.5" y="11.5" width="52" height="52" rx="13" fill="#1a5f4a" />
            <path
              fill="#fff"
              d="M42.65 40.61L42.31 46.16L26.35 46.16L26.35 45.21C26.64 45.18 26.97 45.15 27.35 45.09C27.74 45.04 27.99 44.99 28.11 44.94C28.4 44.83 28.61 44.67 28.72 44.46C28.83 44.26 28.89 44 28.89 43.68L28.89 31.46C28.89 31.17 28.85 30.93 28.76 30.74C28.67 30.55 28.45 30.37 28.11 30.22C27.86 30.1 27.55 30.01 27.2 29.94C26.85 29.87 26.56 29.82 26.35 29.79L26.35 28.84L35.86 28.84L35.86 29.79C35.6 29.82 35.29 29.85 34.94 29.9C34.59 29.94 34.28 30 34.02 30.08C33.7 30.19 33.49 30.35 33.38 30.58C33.28 30.8 33.22 31.06 33.22 31.34L33.22 42.73C33.22 43.27 33.26 43.69 33.33 44C33.41 44.31 33.55 44.54 33.76 44.68C33.97 44.84 34.27 44.94 34.65 44.98C35.02 45.03 35.55 45.05 36.22 45.05C36.87 45.05 37.5 45.01 38.11 44.93C38.73 44.86 39.17 44.69 39.44 44.43C39.85 44.01 40.28 43.43 40.71 42.68C41.15 41.92 41.5 41.23 41.76 40.61Z"
            />
            <circle cx="47.5" cy="24.5" r="3" fill="#e8a838" />
          </g>
        </svg>
      </div>
      <p class="offline-wordmark">LangSwipe</p>
      <h1>Нет интернета</h1>
      <p class="offline-lead">Появится связь — приложение откроется само.</p>
      <a class="offline-retry" id="offline-retry" href="/">Повторить</a>
      <p class="offline-status" id="offline-status" role="status" aria-live="polite">
        Жду связь.
      </p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
